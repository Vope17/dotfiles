# ==========================
#  1. 基礎與前綴鍵設定
# ==========================

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ",xterm-256color:Tc"

set -sg escape-time 10
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g mouse on
set -g status off

unbind C-b
set -g prefix '`'
bind '`' send-prefix

bind r source-file ~/.tmux.conf \; display "Config reloaded!"

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ==========================
#  2. 視窗分割與導航
# ==========================

bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind t new-window -c "#{pane_current_path}"

set -g repeat-time 1000

bind h if-shell -F "#{window_zoomed_flag}" "resize-pane -Z; select-pane -L; resize-pane -Z" "select-pane -L"
bind j if-shell -F "#{window_zoomed_flag}" "resize-pane -Z; select-pane -D; resize-pane -Z" "select-pane -D"
bind k if-shell -F "#{window_zoomed_flag}" "resize-pane -Z; select-pane -U; resize-pane -Z" "select-pane -U"
bind l if-shell -F "#{window_zoomed_flag}" "resize-pane -Z; select-pane -R; resize-pane -Z" "select-pane -R"

bind -r y resize-pane -L 5
bind -r u resize-pane -D 5
bind -r i resize-pane -U 5
bind -r o resize-pane -R 5

bind f resize-pane -Z
bind x kill-pane

# ==========================
#  3. Vi 模式與 TPM 插件
# ==========================

set -g history-limit 50000
set -g wrap-search on
setw -g mode-keys vi

unbind [
unbind a
bind a copy-mode

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

unbind p
bind p paste-buffer

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

run '~/.tmux/plugins/tpm/tpm'
