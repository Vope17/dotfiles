# ==========================
#  1. 基礎與前綴鍵設定
# ==========================

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ",xterm-256color:Tc"

set -sg escape-time 10
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g mouse on
set -g status off

unbind C-b
set -g prefix '`'
bind '`' send-prefix

bind r source-file ~/.tmux.conf \; display "Config reloaded!"

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ==========================
#  2. 視窗分割與導航
# ==========================

bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind t new-window -c "#{pane_current_path}"
bind m command-prompt -F -p "Move pane to window:" "join-pane -h -s '#{pane_id}' -t ':%%'"

set -g repeat-time 1000

bind h if-shell -F "#{window_zoomed_flag}" "resize-pane -Z; select-pane -L; resize-pane -Z" "select-pane -L"
bind j if-shell -F "#{window_zoomed_flag}" "resize-pane -Z; select-pane -D; resize-pane -Z" "select-pane -D"
bind k if-shell -F "#{window_zoomed_flag}" "resize-pane -Z; select-pane -U; resize-pane -Z" "select-pane -U"
bind l if-shell -F "#{window_zoomed_flag}" "resize-pane -Z; select-pane -R; resize-pane -Z" "select-pane -R"

bind -r y resize-pane -L 5
bind -r u resize-pane -D 5
bind -r i resize-pane -U 5
bind -r o resize-pane -R 5

# Swap the current pane with its directional neighbour
bind -r Y swap-pane -Z -s '{active}' -t '{left-of}'
bind -r U swap-pane -Z -s '{active}' -t '{down-of}'
bind -r I swap-pane -Z -s '{active}' -t '{up-of}'
bind -r O swap-pane -Z -s '{active}' -t '{right-of}'

# Equal-size pane layouts
bind H select-layout even-horizontal
bind V select-layout even-vertical
bind T select-layout tiled

bind f resize-pane -Z
bind x kill-pane

# ==========================
#  3. Vi 模式與 TPM 插件
# ==========================

set -g history-limit 50000
set -g wrap-search on
setw -g mode-keys vi

unbind [
unbind a
bind a copy-mode

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection

unbind p
bind p paste-buffer

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Free uppercase I/U for pane swapping
set -g @tpm-install 'C-i'
set -g @tpm-update 'C-u'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-strategy-nvim 'session'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
run '~/.tmux/plugins/tpm/tpm'

# Continuum normally runs from the status line, which is disabled above.
# Poll it once a minute; Continuum enforces the configured save interval.
run-shell -b 'exec 9>"/tmp/tmux-continuum-#{pid}.scheduler.lock"; flock -n 9 || exit 0; while tmux has-session 2>/dev/null; do "$HOME/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh"; sleep 60; done'
